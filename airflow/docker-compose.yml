name: numeralia-airflow

# Airflow local, solo para correr el DAG del reporte diario. LocalExecutor
# porque es un DAG chico (un sensor y un envío de correo): no hace falta la
# complejidad de CeleryExecutor con Redis y workers separados.

x-airflow-common: &airflow-common
  # image primero: en el servidor se hace 'docker compose pull' antes de
  # levantar, así que usa la que ya construyó y subió Actions y nunca
  # intenta reconstruir ahí (el servidor no tiene el repo completo, solo
  # este archivo + dags/ + los secretos). En tu laptop, sin esa imagen
  # descargada, compose la construye local con 'build' la primera vez.
  image: ${AIRFLOW_IMAGE:-ghcr.io/ilseflores/numeralia-airflow}:${AIRFLOW_IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Mexico_City
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Mexico_City
  volumes:
    # Montado en vivo: así un cambio al DAG lo recoge el scheduler solo,
    # sin reconstruir la imagen.
    - ../dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    # El repo, de solo lectura: numeralia ya quedó instalado en la imagen,
    # esto es solo para los secretos que NO se hornean en la imagen.
    - ../.env:/opt/numeralia/.env:ro
    - ../token_gmail.json:/opt/numeralia/token_gmail.json:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Ilse --lastname Flores \
          --role Admin --email ilsefloresreyes@gmail.com \
          || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs:
