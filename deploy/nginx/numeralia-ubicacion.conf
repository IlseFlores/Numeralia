# La carpeta del reporte diario (Numeralia) dentro del sitio de nginx del
# servidor. La instala scripts/servidor-ubuntu.sh en
# /etc/nginx/snippets/numeralia.conf, cambiando PUERTO, y la incluye en el
# bloque `server` del dominio: el del Validador si ya existe, o uno propio
# (deploy/nginx/numeralia.conf) si no.
#
# La carpeta es fija: /reporte-diario/ es la NUMERALIA_RUTA_BASE que pone
# docker-compose.yml, y Dash solo responde debajo de ella.

location = /reporte-diario {
    return 301 /reporte-diario/;
}

location ^~ /reporte-diario/ {
    # Sin URI después del puerto: la carpeta llega completa a Dash.
    proxy_pass http://127.0.0.1:PUERTO;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Generar los PDF del reporte puede pasar del minuto por omisión.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
