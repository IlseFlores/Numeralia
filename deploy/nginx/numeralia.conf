# Sitio propio de nginx para Numeralia. Solo se usa si en el servidor no hay
# ya un sitio para el dominio (el del Validador): en ese caso
# scripts/servidor-ubuntu.sh agrega /reporte-diario/ a ese sitio, porque nginx
# no admite dos bloques `server` con el mismo nombre.
#
# El script cambia DOMINIO por el nombre real; certbot --nginx agrega después
# el certificado, el bloque 443 y la redirección de 80 a HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    include snippets/numeralia.conf;
}
