[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numeralia"
version = "0.1.0"
description = "Pipeline y reporte de calidad del aire — SEMADET / SIMAJ"
requires-python = ">=3.12"
dependencies = [
    "gspread==6.2.1",
    "gspread-dataframe==4.0.0",
    "google-auth==2.62.0",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "openpyxl==3.1.5",
    "dash==4.4.1",
    "plotly==7.1.0",
    "fpdf2==2.8.9",
    "kaleido==1.5.0",
    "python-dotenv==1.2.4",
    "playwright==1.64.1",
    "pypdf==6.21.1",
    "google-auth-oauthlib==1.5.0",
    "google-api-python-client==2.201.0",
    "requests==2.34.2",
]

[project.scripts]
numeralia = "numeralia.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
